spring.application.name=api-gateway

server.port=8765

# Eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

server.forward-headers-strategy=framework

#jwt
jwt.secret=ThisIsMyVerySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=3600000

# Routes

# Auth Swagger
spring.cloud.gateway.server.webmvc.routes[0].id=auth-swagger
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/auth/v3/api-docs,/v3/api-docs

# Auth API
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/**

# Tour Swagger (put before Tour API route)
spring.cloud.gateway.server.webmvc.routes[2].id=tour-service-swagger
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://TOUR-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tours/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RewritePath=/api/tours/v3/api-docs,/v3/api-docs

# Tour API
