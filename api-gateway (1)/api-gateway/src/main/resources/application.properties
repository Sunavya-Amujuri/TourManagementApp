##############################################
# Swagger UI
##############################################

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Tour Service
springdoc.swagger-ui.urls[1].url=/api/tours/v3/api-docs

springdoc.swagger-ui.urls[2].name=Location Service
springdoc.swagger-ui.urls[2].url=/api/locations/v3/api-docs

springdoc.swagger-ui.urls[3].name=Lodging Service
springdoc.swagger-ui.urls[3].url=/api/lodgings/v3/api-docs

