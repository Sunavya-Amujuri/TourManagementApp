spring.application.name=location-service

# Server Port
server.port=8082

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/locationdb
spring.datasource.username=postgres
spring.datasource.password=Sunavya@1234

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.cloud.config.enabled=false

server.forward-headers-strategy=framework
springdoc.use-management-port=false

# JWT
jwt.secret=ThisIsMyVerySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=3600000

# Logging
logging.level.org.springframework=INFO
logging.level.com.location=DEBUG

# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
