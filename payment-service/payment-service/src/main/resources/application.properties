spring.application.name=payment-service

server.port=8087

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=Sunavya@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.forward-headers-strategy=framework
springdoc.use-management-port=false

# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

spring.cloud.config.enabled=false

logging.level.org.springframework.security=DEBUG

# JWT
jwt.secret=ThisIsMyVerySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
