spring.application.name=transport-service

server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/transportdb
spring.datasource.username=postgres
spring.datasource.password=Sunavya@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.forward-headers-strategy=framework
springdoc.use-management-port=false

# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

# JWT
jwt.secret=ThisIsMyVerySecretKeyForJwtAuthentication12345678901234567890
jwt.expiration=3600000

spring.cloud.config.enabled=false

logging.level.com.transport=DEBUG
